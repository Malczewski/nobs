# NOBS runtime config. Upload to GCS as config.yaml; edits apply without redeploy.
# Secrets/IDs live in env vars, NOT here.

digest:
  schedule:
    hour: 8          # 24h clock, in the timezone below
    minute: 13
    timezone: "Europe/Kyiv"
  language: "Ukrainian"   # all output is translated to this language
  model: "gemini-3.5-flash"
  lookback_hours: 24      # default window: only consider entries from the last day
                          # (per-source overridable; max_items is just a safety cap)

  # Applied after each source's own prompt to compress everything into one
  # structured payload that the renderer turns into a message.
  summarize_prompt: >
    Return a JSON array of objects with exactly 3 fields: title, link, summary.
    Be short and concise: squeeze the title into a few words and rephrase the
    description into a brief summary. Skip prices, version numbers and
    abbreviations. Use only the items provided.

  sources:
    - url: "https://techcrunch.com/feed/"
      label: "💻 Tech"
      max_items: 30
      lookback_hours: 24   # optional per-source override
      prompt: >
        From this list of tech news, extract up to 3 breakthrough events that
        could redefine industries or the digital world. Disregard product
        releases, funding rounds, or trivial updates. Skip unnecessary details
        like prices, versions, abbreviations.

    - url: "https://www.sciencedaily.com/rss/all.xml"
      label: "🔬 Science"
      max_items: 30
      prompt: >
        Summarize up to 3 groundbreaking scientific developments 
        that shift current understanding or open new global possibilities. 
        Only include discoveries or achievements with profound implications. 
        Exclude minor studies, academic noise, or numerical findings without wide relevance.

    - url: "https://www.ft.com/?format=rss"
      label: "💰 Finance"
      max_items: 30
      prompt: >
        From this finance news list, extract up to 3 globally significant 
        developments—major economic shifts, crashes, reforms, or moves by central banks 
        or major economies. Skip over startup funding, regional data, or routine market movements. 
        Focus only on events with massive worldwide financial impact.
    
    - url: "http://feeds.bbci.co.uk/news/world/rss.xml"
      label: "🌍 World/Politics"
      max_items: 30
      prompt: >
        Summarize the following list of news titles and descriptions. 
        Return up to 3 world-shaking events only—focus on major geopolitical developments, 
        conflicts, treaties, or leadership changes. Give more attention to Ukraine and Poland. 
        Ignore minor updates, local issues, or statistical reports.

monitor:
  enabled: true
  model: "gemini-3.5-flash"
  evaluate_prompt: >
    You are a strict content filter for a curated channel. Decide whether the
    following message is worth forwarding. Reject clickbait, rage-bait, ads,
    crypto/giveaway spam, vague teasers, and low-information posts. Keep only
    substantive, informative content. Explain your decision in one short
    sentence.

  # Optional. Applied ONLY to messages that pass the filter, right before
  # forwarding. Leave empty to forward the original text unchanged.
  transform_prompt: >
    Rewrite this message into a concise, useful note. Strip filler, hype,
    emojis, hashtags, calls to action, self-promotion and "subscribe" lines.
    Keep the core facts, names, numbers and any links intact. Preserve the
    original language. Output only the cleaned-up text.
