services:
  nobs:
    build: .
    image: nobs:latest
    container_name: nobs
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Path inside the container where the GCP service account key is mounted.
      # Leave GOOGLE_APPLICATION_CREDENTIALS empty in .env to use the VM's
      # attached service account (Application Default Credentials) instead.
      DB_PATH: /data/nobs.db
    volumes:
      # Persist the dedup database across restarts/redeploys.
      - nobs-data:/data
      # Mount the service account key read-only when GOOGLE_APPLICATION_CREDENTIALS
      # points at ./secrets/gcp-sa.json on the host. Harmless if the file is absent.
      - ./secrets:/secrets:ro
    # e2-micro has ~1GB RAM; keep the container from starving the host.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nobs-data:
